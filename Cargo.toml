[package]
name         = "mentci-egui"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/mentci-egui"
description  = "mentci-egui — interactive egui client for the mentci daemon over signal-mentci."

[[bin]]
name = "mentci-egui"
path = "src/main.rs"

[dependencies]
dotos = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "b3c2c76fe7a18ba026ab054d1fa7162e55860b9e" }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "80f70d929ae6d72707052f097be2264872913983", features = ["dotos-text"] }
signal-criome = { git = "https://github.com/LiGoldragon/signal-criome", rev = "b85fe3408faa24b8439a3685396430a68bfbcb71", features = ["dotos-text"] }
signal-mentci = { git = "https://github.com/LiGoldragon/signal-mentci.git", rev = "bf105eac59caa43ca25f7ca263bdc7d2b9080d94", features = ["dotos-text"] }
meta-signal-mentci-client = { git = "https://github.com/LiGoldragon/meta-signal-mentci-client.git", rev = "09843314f04770613a552781feea2046f67c5013", features = ["dotos-text"] }
signal-mentci-client = { git = "https://github.com/LiGoldragon/signal-mentci-client.git", rev = "218ff8022317132aad84c098f0b7de0d5636a535", features = ["dotos-text"] }
# Re-founded client model: the egui shell consumes mentci-lib's ObservationModel
# (MVU core keyed by component socket) and its DOTOS-fallback renderer instead of
# keeping its own approval/transcript state.
mentci-lib   = { git = "https://github.com/LiGoldragon/mentci-lib", rev = "d14f096f69509f378adbfdc0967010a7f2bf0030", features = ["dotos-text"] }
schema-rust = { git = "https://github.com/LiGoldragon/schema-rust.git", rev = "37b7d1035a472a15081f3e2e8a93b95bf733c3ee" }
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "7d10bb9d9a08ce363a0be8cff2716103f0a326fe" }
eframe       = { version = "0.27", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui         = "0.27"
dark-light   = "1.1"
thiserror    = "2"
tokio        = { version = "1", features = ["rt-multi-thread"] }
zbus         = "4.4"

[dev-dependencies]
mentci             = { git = "https://github.com/LiGoldragon/mentci", rev = "aa2ce64448aeba01b20009a7a5a87070d6d9679b" }
meta-signal-mentci = { git = "https://github.com/LiGoldragon/meta-signal-mentci.git", rev = "cb93443d3d50716314c98e5d2d6ca4b5bd5dceba" }
tempfile           = "3"

[lints.rust]
unused = "allow"
dead_code = "allow"
